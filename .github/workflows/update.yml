name: daily-refresh

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch fresh data
        run: python3 fetch_data.py

      - name: Regenerate report
        run: python3 report_gen.py

      - name: Rebuild dashboard
        run: python3 build_dashboard.py

      - name: Commit refreshed artifacts
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ REPORT.md index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh ecosystem data $(date -u +%F)"
            git push
          fi
